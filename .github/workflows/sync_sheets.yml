name: Sync Google Sheets to GitHub

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes
  workflow_dispatch:       # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Explicitly grant write access to commit files
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4   # Updated to v4 to fix Node.js warning

      - name: Download Google Sheet CSV
        run: |
          curl -sL "https://docs.google.com/spreadsheets/d/1z0uNWyuThpH8ACTsnc-zj2bUqMXfVL0nOYGFLcRDWN8/export?format=csv&gid=1529495961" -o scouting_data.csv

      - name: Commit and Push Updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scouting_data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scouting data" && git push)
